<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>V12.0.0 PRISM CAM1</title>
  <link rel="stylesheet" href="../css/app.css?v=1200">
  <style>
    :root{background:transparent!important;color-scheme:dark}
    html,body{position:fixed;inset:0;width:100%;height:100%;margin:0!important;padding:0!important;background:transparent!important;overflow:hidden!important;overscroll-behavior:none}
    #stage{position:fixed;inset:0;width:100vw;height:100vh;width:100dvw;height:100dvh;background:transparent!important;overflow:hidden;isolation:isolate}
    .program-layer,#replayVideo{position:absolute;inset:-2px;width:calc(100% + 4px);height:calc(100% + 4px);object-fit:cover;object-position:center;background:transparent;display:block;opacity:0;z-index:1;transition:opacity .20s linear;transform:translateZ(0)}
    .program-layer.live{opacity:1}
    #programNext{z-index:2}
    #replayVideo{display:none;z-index:8;opacity:1}#replayVideo.show{display:block}
    #overlayViewport{z-index:12;position:absolute;inset:0;width:100%;height:100%;overflow:hidden;pointer-events:none;background:transparent}
    #overlayFrame{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;background:transparent;color-scheme:normal}
    #fade,#black{z-index:20;position:absolute;inset:0;pointer-events:none;background:#000}
    #fade{opacity:0;transition:opacity .45s linear}#fade.show{opacity:1}
    #black{opacity:0;transition:opacity .2s linear}#black.show{opacity:1}
    #diagnostic{position:fixed;left:10px;bottom:10px;z-index:50;padding:7px 10px;border-radius:999px;background:rgba(0,0,0,.8);color:#fff;font:600 12px/1.2 system-ui;display:none}
    html.debug #diagnostic{display:block}
    #replayTransition{display:none;position:absolute;inset:0;z-index:30;background:#000;align-items:center;justify-content:center;overflow:hidden}#replayTransition.show{display:flex;animation:stingerIn .22s ease-out}#replayTransition img,#replayTransition video{width:100%;height:100%;object-fit:cover;background:#000}#replayTransition .fallback{font:900 clamp(42px,8vw,130px)/1 system-ui;color:#fff;text-align:center;letter-spacing:.08em;text-shadow:0 0 25px #16bfff}#replayTransition .fallback span{display:block;font-size:.36em;margin-top:.4em;color:#35d6ff}@keyframes stingerIn{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:scale(1)}}
    #replayBug{display:none;position:absolute;left:3%;top:5%;z-index:18;padding:10px 18px;border-radius:7px;background:#d00000;color:#fff;font:900 18px/1 system-ui;letter-spacing:2px;box-shadow:0 3px 14px rgba(0,0,0,.5)}#replayBug.show{display:block;animation:bugPulse 1.1s infinite}@keyframes bugPulse{50%{opacity:.72}}
  </style>
</head>
<body>
  <div id="stage">
    <video id="program" class="program-layer live" autoplay playsinline></video>
    <video id="programNext" class="program-layer" autoplay playsinline></video>
    <video id="replayVideo" playsinline></video><div id="replayBug">REPLAY</div><div id="replayTransition"><img id="replayTransitionImage" alt="Transición Replay"><video id="replayTransitionVideo" muted playsinline></video><div id="replayTransitionFallback" class="fallback">REPLAY<span>DEPORTES</span></div></div>
    <div id="overlayViewport"><iframe id="overlayFrame" title="Overlay integrado" allow="autoplay; fullscreen" referrerpolicy="no-referrer"></iframe></div>
    <div id="fade"></div><div id="black"></div>
  </div>
  <div id="diagnostic">Iniciando V12…</div>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="../config/firebase-config.js?v=1200"></script>
  <script src="../config/app-config.js?v=1200"></script>
  <script src="../js/shared/core.js?v=1200"></script>
  <script src="../js/broadcast/app.js?v=1200"></script>
</body>
</html>
