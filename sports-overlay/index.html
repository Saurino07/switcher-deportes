<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>V17 Sports Overlay</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;font-family:Inter,system-ui,Segoe UI,sans-serif;color:#fff}*{box-sizing:border-box}#baseballFrame{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;display:none}.native{position:absolute;left:0;top:0;width:980px;height:360px;display:none;align-items:flex-start;justify-content:flex-start;padding:12px}.board{width:960px;min-height:170px;border:2px solid #d2ac45;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,rgba(2,17,34,.97),rgba(5,54,91,.94));box-shadow:0 14px 36px rgba(0,0,0,.55)}.title{height:42px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;letter-spacing:1.2px;background:rgba(0,0,0,.25);border-bottom:1px solid rgba(255,255,255,.14)}.main{display:grid;grid-template-columns:1fr 230px 1fr;align-items:center;min-height:112px}.team{display:grid;grid-template-columns:72px 1fr 90px;gap:12px;align-items:center;padding:14px 20px}.team.away{grid-template-columns:90px 1fr 72px;text-align:right}.logo{width:64px;height:64px;border-radius:12px;object-fit:contain;background:rgba(0,0,0,.25)}.name{font-size:30px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{font-size:64px;font-weight:950;line-height:1;text-align:center;background:rgba(0,0,0,.28);padding:12px;border-radius:14px}.center{text-align:center}.live{display:inline-block;background:#ef2737;border-radius:999px;padding:5px 14px;font-weight:900;font-size:15px}.period{margin-top:10px;font-size:24px;font-weight:900}.clock{font-size:32px;font-variant-numeric:tabular-nums;font-weight:950}.details{min-height:48px;display:flex;align-items:center;justify-content:center;gap:22px;padding:8px 18px;background:rgba(0,0,0,.32);font-size:18px;font-weight:800}.pill{padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.1)}
</style></head><body><iframe id="baseballFrame" src="../overlay/index.html?embedded=1" scrolling="no" allowtransparency="true"></iframe><div id="native" class="native"><div class="board"><div class="title" id="title">TRANSMISIÓN DEPORTIVA</div><div class="main"><div class="team"><img class="logo" id="homeLogo"><div class="name" id="homeName">LOCAL</div><div class="score" id="homeScore">0</div></div><div class="center"><span class="live">EN VIVO</span><div class="period" id="period">1°</div><div class="clock" id="clock">00:00</div></div><div class="team away"><div class="score" id="awayScore">0</div><div class="name" id="awayName">VISITANTE</div><img class="logo" id="awayLogo"></div></div><div class="details" id="details"></div></div></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="../config/firebase-config.js?v=1710"></script><script src="../config/app-config.js?v=1710"></script><script src="../js/shared/core.js?v=1710"></script>
<script>(()=>{const $=id=>document.getElementById(id),game=Switcher.normalizeId(Switcher.qs('game',Switcher.app.defaultGame)),db=Switcher.initFirebase();let sport='baseball',cfg={},score={};const labels={soccer:'FÚTBOL',basketball:'BÁSQUETBOL',volleyball:'VOLEIBOL',football:'FÚTBOL AMERICANO',baseball:'BÉISBOL'};function safeLogo(el,url){el.src=url||'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="100%" height="100%" rx="12" fill="%230b2943"/><text x="50%" y="58%" text-anchor="middle" font-size="28" fill="white">★</text></svg>'}function detailItems(){if(sport==='soccer')return [`Tiempo ${score.period||'1T'}`,score.added?`+${score.added}`:'',score.possession?`Posesión ${score.possession}`:''];if(sport==='basketball')return [`Cuarto ${score.period||'1'}`,`Reloj de tiro ${score.shotClock||24}`,`Faltas ${score.homeFouls||0}-${score.awayFouls||0}`];if(sport==='volleyball')return [`Set ${score.period||1}`,`Sets ${score.homeSets||0}-${score.awaySets||0}`,score.serving==='home'?`${cfg.homeName||'LOCAL'} sirve`:`${cfg.awayName||'VISITANTE'} sirve`];if(sport==='football')return [`${score.down||1}ª y ${score.yards||10}`,`Balón en ${score.ballOn||50}`,`Cuarto ${score.period||1}`];return []}function paint(){const bb=sport==='baseball';$('baseballFrame').style.display=bb?'block':'none';$('native').style.display=bb?'none':'flex';if(bb)return;$('title').textContent=cfg.title||labels[sport]||'TRANSMISIÓN DEPORTIVA';$('homeName').textContent=cfg.homeName||'LOCAL';$('awayName').textContent=cfg.awayName||'VISITANTE';$('homeScore').textContent=score.homeScore??0;$('awayScore').textContent=score.awayScore??0;$('period').textContent=sport==='soccer'?(score.period||'1T'):`${score.period||1}${sport==='basketball'?'Q':''}`;$('clock').textContent=score.clock||'00:00';safeLogo($('homeLogo'),cfg.homeLogo);safeLogo($('awayLogo'),cfg.awayLogo);$('details').innerHTML=detailItems().filter(Boolean).map(x=>`<span class="pill">${String(x).replace(/[<>&]/g,'')}</span>`).join('')}db.ref(`switcher/${game}/sport/current`).on('value',s=>{sport=s.val()||'baseball';paint()});db.ref(`switcher/${game}/sport/config`).on('value',s=>{cfg=s.val()||{};paint()});db.ref(`switcher/${game}/sport/score`).on('value',s=>{score=s.val()||{};paint()});paint()})();</script></body></html>
