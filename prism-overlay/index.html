<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>V14.5 Overlay PRISM</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}#scoreWrap{position:absolute;left:2%;top:3%;width:28%;height:28%;min-width:280px;max-width:400px;pointer-events:none;overflow:visible}#scoreFrame{position:absolute;left:0;top:0;width:980px;height:360px;border:0;background:transparent;transform-origin:top left}.lower{display:none;position:absolute;left:4%;bottom:8%;min-width:min(520px,68vw);max-width:78vw;padding:14px 22px;border-left:8px solid #19d98b;border-radius:8px;background:linear-gradient(90deg,rgba(3,13,28,.96),rgba(6,30,52,.9));box-shadow:0 10px 28px rgba(0,0,0,.5);color:#fff}.lower.show{display:block}.name{font:900 clamp(22px,3vw,42px)/1.05 system-ui;text-transform:uppercase}.role{margin-top:6px;font:700 clamp(14px,1.5vw,22px)/1.15 system-ui;color:#b9d5ec}#status{display:none}</style></head><body><div id="scoreWrap"><iframe id="scoreFrame" src="../overlay/index.html?embedded=1" scrolling="no" allowtransparency="true"></iframe></div><div id="lower" class="lower"><div id="name" class="name"></div><div id="role" class="role"></div></div><div id="status"></div><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="../config/firebase-config.js?v=1450"></script><script src="../config/app-config.js?v=1450"></script><script src="../js/shared/core.js?v=1450"></script><script>(()=>{const game=Switcher.normalizeId(Switcher.qs("game",Switcher.app.defaultGame));const db=Switcher.initFirebase();const wrap=document.getElementById("scoreWrap"),frame=document.getElementById("scoreFrame"),lower=document.getElementById("lower"),name=document.getElementById("name"),role=document.getElementById("role");let enabled=true,mode="master",scene="game",cfg={};function scale(){const target=Math.min(400,Math.max(260,innerWidth*.28));frame.style.transform=`scale(${target/980})`}function paint(){const prism=mode==="prism";wrap.style.display=prism&&enabled&&scene!=="clean"&&scene!=="interview"?"block":"none";lower.classList.toggle("show",prism&&scene==="interview"&&!!(cfg.name||cfg.role));name.textContent=cfg.name||"ENTREVISTA";role.textContent=cfg.role||""}addEventListener("resize",scale);scale();db.ref(`switcher/${game}/broadcast/outputMode`).on("value",s=>{mode=s.val()||"master";paint()});db.ref(`switcher/${game}/broadcast/overlay`).on("value",s=>{enabled=(s.val()||{}).enabled!==false;paint()});db.ref(`switcher/${game}/broadcast/activeScene`).on("value",s=>{scene=s.val()||"game";paint()});db.ref(`switcher/${game}/broadcast/sceneConfig/interview`).on("value",s=>{cfg=s.val()||{};paint()});frame.addEventListener("load",()=>{try{const d=frame.contentDocument;d.documentElement.style.background="transparent";d.body.style.background="transparent";let st=d.getElementById("prism-compact-fix");if(!st){st=d.createElement("style");st.id="prism-compact-fix";(d.head||d.documentElement).appendChild(st)}st.textContent=`html,body{background:transparent!important;overflow:hidden!important}body.v10-embedded #overlay-root{top:0!important;left:0!important;width:980px!important;min-width:980px!important;animation:none!important;transition:none!important}body.v10-embedded #overlay-scale{transform:none!important;transform-origin:top left!important}body.v10-embedded #overlay-bar::before{display:none!important}`;}catch{}})})();</script></body></html>
