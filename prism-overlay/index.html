<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>V17.5 Overlay PRISM</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}#scoreFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent;pointer-events:none}.lower{display:none;position:absolute;left:4%;bottom:8%;min-width:min(520px,68vw);max-width:78vw;padding:14px 22px;border-left:8px solid #19d98b;border-radius:8px;background:linear-gradient(90deg,rgba(3,13,28,.96),rgba(6,30,52,.9));box-shadow:0 10px 28px rgba(0,0,0,.5);color:#fff}.lower.show{display:block}.name{font:900 clamp(22px,3vw,42px)/1.05 system-ui;text-transform:uppercase}.role{margin-top:6px;font:700 clamp(14px,1.5vw,22px)/1.15 system-ui;color:#b9d5ec}</style></head><body>
<iframe id="scoreFrame" scrolling="no" allowtransparency="true"></iframe><div id="lower" class="lower"><div id="name" class="name"></div><div id="role" class="role"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="../config/firebase-config.js?v=1750"></script><script src="../config/app-config.js?v=1750"></script><script src="../js/shared/core.js?v=1750"></script>
<script>(()=>{const game=Switcher.normalizeId(Switcher.qs("game",Switcher.app.defaultGame)),db=Switcher.initFirebase(),frame=document.getElementById("scoreFrame"),lower=document.getElementById("lower"),name=document.getElementById("name"),role=document.getElementById("role");let enabled=true,mode="master",scene="game",cfg={},layout={sizePct:28,position:"top-left",marginX:2,marginY:3},sport="baseball";
const source=()=>sport==="baseball"?`../overlay/index.html?embedded=1&game=${encodeURIComponent(game)}`:`../sports-overlay/index.html?embedded=1&game=${encodeURIComponent(game)}`;
function load(){const u=new URL(source(),location.href).href;if(frame.src!==u)frame.src=u}
function inject(){try{const d=frame.contentDocument;if(!d?.body)return;d.documentElement.style.setProperty("background","transparent","important");d.body.style.setProperty("background","transparent","important");d.body.classList.add("v10-embedded","prism-layout");const pct=Math.max(18,Math.min(45,+layout.sizePct||28)),mx=Math.max(0,Math.min(10,+layout.marginX||2)),my=Math.max(0,Math.min(10,+layout.marginY||3)),target=Math.min(520,Math.max(220,innerWidth*pct/100)),pos=layout.position||"top-left",x=pos.includes("right")?`right:${mx}vw!important;left:auto!important;`:`left:${mx}vw!important;right:auto!important;`,y=pos.includes("bottom")?`bottom:${my}vh!important;top:auto!important;`:`top:${my}vh!important;bottom:auto!important;`;let st=d.getElementById("v171-prism-layout");if(!st){st=d.createElement("style");st.id="v171-prism-layout";(d.head||d.documentElement).appendChild(st)}if(d.getElementById("overlay-bar")){const scale=target/1250;st.textContent=`html,body{margin:0!important;width:100vw!important;height:100vh!important;overflow:hidden!important;background:transparent!important}body.prism-layout #overlay-root{position:fixed!important;inset:0!important;width:100vw!important;min-width:0!important;height:100vh!important;transform:none!important}body.prism-layout #overlay-scale{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;transform:none!important}body.prism-layout #overlay-flex{position:static!important;display:block!important;width:auto!important}body.prism-layout #overlay-bar{position:fixed!important;${x}${y}width:1250px!important;min-width:1250px!important;transform:scale(${scale})!important;transform-origin:${pos.includes("right")?"top right":"top left"}!important}body.prism-layout #overlay-bar::before{display:none!important}`;}else{const board=d.querySelector(".board"),base=board?.offsetWidth||960,scale=target/base;st.textContent=`html,body{margin:0!important;width:100vw!important;height:100vh!important;overflow:hidden!i function paint(){const prism=mode==="prism";frame.style.display=prism&&enabled&&scene!=="clean"&&scene!=="interview"?"block":"none";lower.classList.toggle("show",prism&&scene==="interview"&&!!(cfg.name||cfg.role));name.textContent=cfg.name||"ENTREVISTA";role.textContent=cfg.role||"";inject()}
frame.addEventListener("load",()=>{inject();setTimeout(inject,150);setTimeout(inject,700)});addEventListener("resize",inject);db.ref(`switcher/${game}/sport/current`).on("value",s=>{sport=s.val()||"baseball";load();paint()});db.ref(`switcher/${game}/broadcast/outputMode`).on("value",s=>{mode=s.val()||"master";paint()});db.ref(`switcher/${game}/broadcast/overlayLayout`).on("value",s=>{layout={...layout,...(s.val()||{})};paint()});db.ref(`switcher/${game}/broadcast/overlay`).on("value",s=>{enabled=(s.val()||{}).enabled!==false;paint()});db.ref(`switcher/${game}/broadcast/activeScene`).on("value",s=>{scene=s.val()||"game";paint()});db.ref(`switcher/${game}/broadcast/sceneConfig/interview`).on("value",s=>{cfg=s.val()||{};paint()});load();paint()})();</script></body></html>
